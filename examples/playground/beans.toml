# Paths are relative to this file. Dependencies expose sources in one direction.

# JDK home can be set two ways:
#  - By uncommenting `jdk_home =` below and give a path there
#  - By defining `BEANS_WORKSPACE_TOML_JAVA_HOME` that will override this value
# jdk_home = "vendor/jdk"

[module.demo]
sources = ["src/demo"]
depends_on = ["library"]

[module.library]
sources = ["src/library"]
