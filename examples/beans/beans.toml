# The descriptor Beans reads at startup. Paths are relative to this file.
#
# Two projects, four units. A unit is one compilation scope, so main and test
# are separate units: they do not see the same things.
#
#   a-main  <--  a-test
#     ^
#     |
#   b-main  <--  b-test
#
# Arrows point at what a unit may look at. Two things follow, and the example
# is built to show both:
#
#   1. Nothing points into a test unit. Not the main code of the same project,
#      not another project's tests.
#   2. b sees a, so a must not see b.

# The JDK every unit compiles against, and its own setting rather than a
# classpath entry: a project has one runtime, and it is what every other name
# is resolved against.
#
# Commented out because a JDK lives outside the project and its path is
# whatever this machine happens to have, which is not something a committed
# file can say. `mise where java` prints the one this repository pins.
#
# jdk_home = "/path/to/jdk"

# The guided tour: `Demo.java` at the top, and the file it navigates to under
# `demo/`.
#
# A unit is not needed for the tour to *resolve*. A file no unit declares stays
# unscoped, and unscoped sees everything rather than nothing — which is what
# keeps a scratch file working next to a project.
#
# It is needed for the tour to be *loaded*. Only a unit's sources are read at
# startup, so without this the second file would not be in the lake and step
# 4's F12 into `demo/Neighbour.java` would find nothing until you opened it by
# hand.
#
# `Demo.java` is named directly rather than by its directory, because its
# directory is the example root and a unit claiming that would swallow `a/` and
# `b/` too. A selector naming one file is a tree of one.
#
# Depends on nothing: everything the tour shows is decided inside these two
# files.
[unit.demo]
sources = ["Demo.java", "demo"]

[unit.a-main]
sources = ["a/src/main/java"]

[unit.a-test]
sources = ["a/src/test/java"]
depends_on = ["a-main"]

[unit.b-main]
sources = ["b/src/main/java"]
depends_on = ["a-main"]

[unit.b-test]
sources = ["b/src/test/java"]
# `a-main` is spelled out because depends_on does not chain. The edge to
# `b-main` does not carry what `b-main` itself depends on. Delete it and
# BTest.toOtherMain goes dark while b-main keeps working.
depends_on = ["b-main", "a-main"]
