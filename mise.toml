[tools]
node = "24.22.1"
rust = { version = "stable", components = ["rustfmt", "clippy"] }

# JDK 26 is on PATH and supplies both compression modes for jimage fixtures.
# JDK 21 writes big-endian images, which `jlink` refuses from 24 on.
# JDK 17 is the sidecar toolchain (mise names Temurin 17.0.21.1+2 as below).
# The full writer sweep is in `mise.ci.toml`.
java = ["temurin-26.0.2", "temurin-21.0.12", "temurin-17.0.21+100000002"]
