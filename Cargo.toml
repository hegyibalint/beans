[workspace]
resolver = "3"
members = [
    "crates/beans-core",
    "crates/beans-lang",
    "crates/beans-lang-java",
    "crates/beans-lsp",
    "crates/beans-platform-jvm",
    "crates/beans-testing",
    "crates/beans-workspace",
    "crates/beans-workspace-toml",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Bálint Hegyi <me@blnt.dev>"]
license = "Apache-2.0"

[workspace.dependencies]
beans-core = { path = "crates/beans-core" }
beans-lang = { path = "crates/beans-lang" }
beans-lang-java = { path = "crates/beans-lang-java" }
beans-platform-jvm = { path = "crates/beans-platform-jvm" }
beans-testing = { path = "crates/beans-testing" }
beans-workspace = { path = "crates/beans-workspace" }
beans-workspace-toml = { path = "crates/beans-workspace-toml" }
cafebabe = { version = "0.9", default-features = false }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
lsp-server = "0.8"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
url = "2"
