[workspace]
resolver = "3"
members = [
    "crates/beans-core",
    "crates/beans-engine",
    "crates/beans-lang-java",
    "crates/beans-lsp",
    "crates/beans-platform-jvm",
    "crates/beans-testing",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Bálint Hegyi <me@blnt.dev>"]
license = "Apache-2.0"

[workspace.dependencies]
beans-core = { path = "crates/beans-core" }
beans-engine = { path = "crates/beans-engine" }
beans-lang-java = { path = "crates/beans-lang-java" }
beans-platform-jvm = { path = "crates/beans-platform-jvm" }
blake3 = "1"
cafebabe = { version = "0.9", default-features = false }
lsp-server = "0.8"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
url = "2"
