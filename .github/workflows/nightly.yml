name: Nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check for an unreleased commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .immutable == true)][0].target_commitish // ""')
          if [ "$previous" = "$GITHUB_SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "This commit has already been released." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - name: Build and test the release executable
        run: cargo test --release --locked -p beans-lsp --test stdio
      - name: Prepare release assets
        run: |
          mkdir dist
          cp target/release/beans-lsp dist/beans-lsp-linux-x86_64
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum beans-lsp-linux-x86_64 LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nightly-linux-x86_64
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create a draft with all assets
        run: |
          printf '%s\n\n' \
            'Development snapshot of Beans. Expect missing features and rough edges.' \
            "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Binary: Linux x86-64, built on Ubuntu 24.04. Other platforms are not packaged yet.' \
            > notes.md
          gh release create "$TAG" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes-file notes.md
      - name: Publish as the latest release
        run: gh release edit "$TAG" --draft=false --latest
      - name: Check release immutability
        run: |
          immutable=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.immutable')
          if [ "$immutable" != true ]; then
            echo '::error::The published release is mutable. Enable release immutability in repository settings before publishing further releases.'
            exit 1
          fi
          echo "Published [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
