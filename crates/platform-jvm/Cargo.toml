[package]
name = "platform-jvm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "beans_platform_jvm"

[dependencies]
cafebabe = { version = "0.9.0", default-features = false }
core = { path = "../core" }
# Expands the entries of a runtime image built with `jlink --compress`. The
# backend is the one `zip` already selects, so this adds no crate to the tree.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# Locates the JDK the runtime-image tests read, shared with the acceptance
# suite so one `mise.toml` pin answers for both.
test-support = { path = "../../tests/support" }
