[package]
name = "java-inspect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "java-inspect"
path = "src/main.rs"
# The `#[path]` includes in main.rs drag lang-java's `#[cfg(test)] mod tests`
# blocks along with them. Without this, those tests compile and run a second
# time here, against a different dependency graph than the one that ships.
test = false

[dependencies]
core = { path = "../../crates/core" }
tree-sitter.workspace = true
tree-sitter-java.workspace = true
